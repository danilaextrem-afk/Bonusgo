name: Keep site awake
# Render free instances sleep after ~15 min idle, so the first visitor waits ~50 s.
# A customer scanning a QR at the counter should not wait. This ping also
# triggers the existing best-effort housekeeping scheduler on /api/health.
# Render itself uses /api/live for side-effect-free process liveness.
# Only 08:00–23:00 Moscow (05–19 UTC): the 750 free instance-hours/month are shared with
# another free service in the same Render workspace, so 24/7 would exhaust them (~465 h used).
on:
  schedule:
    - cron: "*/10 5-19 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping scheduler health endpoint; report unavailable service
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 90 \
            --retry 3 --retry-delay 15 \
            "${{ vars.APP_URL || 'https://qronus.onrender.com' }}/api/health"
          echo "QRonus health responded successfully"
