name: Keep site awake
# Render free instances sleep after ~15 min idle, so the first visitor waits ~50 s.
# A customer scanning a QR at the counter should not wait, so we ping the health check.
# Only 08:00–23:00 Moscow (05–19 UTC): the 750 free instance-hours/month are shared with
# another free service in the same Render workspace, so 24/7 would exhaust them (~465 h used).
on:
  schedule:
    - cron: "*/10 5-19 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        run: |
          curl -fsS --retry 3 --retry-delay 20 -m 90 "${{ vars.APP_URL || 'https://bonusgo.onrender.com' }}/api/health" || echo "site did not respond"
