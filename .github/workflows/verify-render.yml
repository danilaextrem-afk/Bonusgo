name: Verify published Render revision

# Manual, read-only publication probe. Never deploy or enable payments.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test deployment probe locally (no network)
        run: node --test tests/ops/render-probe.test.mjs
      - name: Check Render availability and published commit
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/check-render.mjs
