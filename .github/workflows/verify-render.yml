name: Verify published Render revision

# Run manually after Render finishes deploying. This checks a read-only endpoint.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare public deployed revision to selected GitHub commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://qronus.onrender.com/api/version"
          body="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 35 --retry 2 --retry-delay 3 \
            "$URL")"
          if [ "${#body}" -gt 1024 ]; then
            echo "Unexpectedly large deployment response"; exit 1
          fi
          printf '%s' "$body" | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              let data;
              try { data = JSON.parse(input); }
              catch { console.error("Invalid deployment JSON"); process.exitCode = 1; return; }
              const revision = data?.revision;
              const expected = process.env.EXPECTED_SHA?.slice(0, 12).toLowerCase();
              if (typeof revision !== "string" || !/^[a-f0-9]{12}$/.test(revision)) {
                console.error("Deployed revision is missing or invalid; publication not verified");
                process.exitCode = 1;
                return;
              }
              if (revision !== expected) {
                console.error("Render revision does not match GitHub selected branch");
                console.error("Expected:", expected, "Found:", revision);
                process.exitCode = 1;
                return;
              }
              console.log("Verified Render revision:", revision);
            });
          '
