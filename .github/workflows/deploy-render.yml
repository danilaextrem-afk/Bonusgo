name: Deploy QRonus to Render (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_QRONUS to deploy latest Render-linked main"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deliberate request and main branch
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$CONFIRM" != "DEPLOY_QRONUS" ]]; then
            echo "Select main and type DEPLOY_QRONUS exactly."
            exit 1
          fi

      - name: Require latest main commit and successful CI for that exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo "Main advanced since workflow dispatch. Refusing to deploy unverified latest."
            exit 1
          fi
          passed_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
          if [[ "$passed_sha" != "$GITHUB_SHA" ]]; then
            echo "No successful CI run for the selected main commit. Refusing deployment."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deploy-hook guard offline
        run: node --test tests/ops/render-deploy-hook.test.mjs

      - name: Trigger latest linked branch via Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: node scripts/request-render-deploy.mjs

      - name: Explain verification step
        run: |
          echo "Render deploy request was submitted without ref (Auto-Deploy unchanged). Live publication is not yet verified."
          echo "After Render completes, run Actions > Verify published Render revision."
