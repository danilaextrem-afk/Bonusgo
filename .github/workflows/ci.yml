name: CI
on:
  push:
    branches: [main]
  pull_request:
# Keep only the newest run per branch/PR to avoid concurrent Chromium downloads.
concurrency:
  group: qronus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qronus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qronus_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/qronus_test
      SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      APP_URL: http://localhost:3100
      PAYMENTS_TEST_MODE: "true"
      ADMIN_EMAILS: admin@qronus.test
      # CI server runs `next start` (production mode): explicitly allow test payments there only.
      ALLOW_TEST_PAYMENTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx drizzle-kit migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
