name: Scheduled jobs
on:
  schedule:
    - cron: "17 2 * * *" # daily: expire subscriptions, ping IndexNow
  workflow_dispatch:
jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_URL: ${{ vars.APP_URL || 'https://qronus.onrender.com' }}
    steps:
      - name: Skip until CRON_SECRET is configured
        if: env.CRON_SECRET == ''
        run: echo "CRON_SECRET secret not set; skipping."
      - name: Expire subscriptions
        if: env.CRON_SECRET != ''
        run: |
          curl -fsS --retry 3 --retry-delay 30 -m 120 -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/payments/cron/expire"
      - name: Submit sitemap URLs to IndexNow (Yandex, Bing)
        if: env.CRON_SECRET != ''
        run: |
          curl -fsS --retry 3 --retry-delay 30 -m 120 -X POST -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/indexnow"
