services:
  - type: web
    name: qronus-staging
    runtime: node
    plan: free
    region: frankfurt
    branch: deploy/qronus-staging
    autoDeployTrigger: "off"
    healthCheckPath: /api/ready
    buildCommand: export APP_URL="${RENDER_EXTERNAL_URL:?}" && npm ci --no-audit --no-fund && npm run build
    startCommand: export APP_URL="${RENDER_EXTERNAL_URL:?}" && npm run db:migrate && exec npm run start -- -H 0.0.0.0 -p "$PORT"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: qronus-staging-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: QRONUS_STAGING
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: PAYMENTS_TEST_MODE
        value: "true"
      - key: ALLOW_TEST_PAYMENTS
        value: "true"
      - key: PLATEGA_LIVE_ENABLED
        value: "false"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
