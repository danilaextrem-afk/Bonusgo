# Render Blueprint (free web service). DATABASE_URL points to Neon (set in Render dashboard / MCP, never in git).
services:
  - type: web
    name: bonusgo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npx drizzle-kit migrate && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: PAYMENTS_TEST_MODE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: APP_URL
        sync: false
