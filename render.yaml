# Render Blueprint (free web service). DATABASE_URL points to Neon (set in Render dashboard / MCP, never in git).
services:
  - type: web
    name: qronus
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build && npm run db:migrate
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    # No background jobs or DB access during Render process health checks.
    healthCheckPath: /api/live
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: PAYMENTS_TEST_MODE
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: APP_URL
        sync: false
